body{

.hide{

/* LOGIN */

/* HOME */

.top{

.actionBtn{

.count{

/* LIKE */

function likeVideo(button){

  let count =
    button
    .querySelector(".count");


  let number =
    Number(count.innerText);


  if(
    button.dataset.liked !== "yes"
  ){

    number++;

    button.dataset.liked =
      "yes";

    button.firstChild
      .textContent = "💖 ";

  }else{

    number--;

    button.dataset.liked =
      "";

    button.firstChild
      .textContent = "❤️ ";

  }


  count.innerText =
    number;

}

/* VIDEO AUTO PLAY / SOUND CONTROL */

let videos =
  document.querySelectorAll(
    ".videoBox video"
  );


let observer =
  new IntersectionObserver(

    function(entries){

      entries.forEach(
        function(entry){

          let video =
            entry.target;


          if(entry.isIntersecting){

            video.play()
              .catch(
                function(){}
              );

          }else{

            video.pause();

            video.muted =
              true;

          }

        }
      );

    },

    {
      threshold:0.6
    }

  );


videos.forEach(
  function(video){

    observer.observe(video);

  }
);

function setupVideo(video){

  observer.observe(video);

  video.addEventListener(
    "play",
    function(){

      document
      .querySelectorAll(".videoBox video")
      .forEach(
        function(other){

          if(other !== video){

            other.pause();

            other.muted = true;

          }

        }
      );

    }
  );

  }
  document
.querySelectorAll(".videoBox")
.forEach(
  function(box){

    box.addEventListener(
      "dblclick",
      function(){

        let button =
          box.querySelector(
            ".actionBtn"
          );

        likeVideo(button);

      }
    );

);
